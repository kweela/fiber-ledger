name: Docs

# Builds the VitePress site on every push and publishes it to GitHub Pages from
# the default branch. Pull requests build but do not deploy, so a broken link or
# a failed build is caught before it is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages needs to read the checkout, write the artifact, and mint the token it
# deploys with. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is not cancelled, so a push that lands
# during a deploy still publishes rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # VitePress reads the git history to date each page.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm docs:build
        env:
          # A project site is served from /<repository>/, so every asset and
          # link has to be built against that path.
          DOCS_BASE: ${{ github.event.repository.homepage }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
