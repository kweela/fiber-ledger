name: Publish

# Publishes the package to npm, either by hand with an explicit version or when
# a GitHub release is published, using the release tag (a leading "v" is dropped).
# The published version is then committed to package.json on the branch it came
# from, or the default branch for a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.3 or 1.3.0-beta.1
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a semantic version"
            exit 1
          fi

          # Prereleases go to the "next" dist-tag so they never become "latest".
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Set package version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Check
        run: pnpm check

      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Publish
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --access public --provenance --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version
        if: github.event_name == 'release' || github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git checkout -- .
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          DIR=.
          npm pkg set version="$VERSION" --prefix "$DIR"

          if git diff --quiet; then
            echo "$DIR/package.json is already at $VERSION"
            exit 0
          fi

          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git commit -am "chore: release $VERSION"
          git push origin "$BRANCH"
